<script>
(function(){
"use strict";
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ================= 术语表 ================= */
var GLOSS = {
  "Agent":"由 Model 与 Harness 共同构成，能围绕目标观察、判断、行动并接受反馈的执行主体。",
  "Model":"提供理解、推理、生成和工具调用决策的概率性认知核心。它不能独立负责状态、权限、恢复和验证。",
  "Harness":"模型之外的工程系统：组织上下文、能力、状态、环境和控制机制，把模型判断变成可执行、可恢复、可验证的任务过程。",
  "Harness 编排层":"广义 Harness 中直接组织任务循环的部分：决定模型看到什么、能调用什么、何时停止、结果要过哪些验证。",
  "Agentic Application":"Agent 在应用形态层的完整表达：结合业务逻辑、数据、工具、环境和用户交互，交付可验证的任务结果。",
  "Agent Platform":"为多个 Agent 提供共享的创建、接入、运行、治理、观测和优化能力的企业平台。",
  "Single-Agent":"由单个 Agent 持有任务循环、在明确边界内完成有界任务的基础形态。",
  "Long-Horizon Agent":"能跨多轮、跨会话或跨进程持续执行，靠持久状态、检查点和恢复维持连续性的 Agent。不是“上下文窗口更大”。",
  "Multi-Agent":"多个有不同角色、能力或权限边界的 Agent，通过编排、通信、移交或评审共同完成任务。不是“简单并发调多个模型”。",
  "Workflow":"执行路径在设计时预先确定的流程，确定性强、易测试、易审计。",
  "Hybrid":"Workflow 与 Agent 结合：Workflow 固定审批、交易等确定性边界，Agent 负责检索、分析、方案生成等不确定部分。",
  "Copilot":"由人持续决定目标和下一步、模型辅助完成局部工作的形态。",
  "RAG":"检索增强生成：先从知识库检索相关片段，再交给模型生成回答。",
  "GraphRAG":"在向量检索之上加知识图谱层，处理需要跨实体关系推理的问题。",
  "Context":"这一次模型调用应该看到的内容。每次调用都会重建，不作为事实来源。",
  "State":"任务已经发生了什么、应从哪里恢复。任务级，需要强一致和持久化。",
  "Memory":"Agent 从任务和交互中有选择地积累的经验与信息，跨任务使用，需要写入门槛、更新和遗忘。",
  "Knowledge":"组织已有的外部知识（制度、文档、数据），由内容所有者维护，需要权限过滤和时效管理。",
  "Skill":"告诉 Agent “某类任务应该怎么做”的可复用能力包：说明、脚本、模板、检查清单。需要版本化发布。",
  "Tool":"Agent 可以请求的一项可执行动作。",
  "MCP":"Model Context Protocol，模型上下文协议：让 Agent 以标准方式发现和连接工具、资源等外部能力。",
  "A2A":"Agent-to-Agent 协议：与拥有独立任务循环的远程 Agent 交换任务、消息、状态和产物。",
  "Function Calling":"模型用结构化格式表达“想调用哪个能力、提供什么参数”的意图接口。",
  "Runtime":"管理任务生命周期的系统：排队、并发、暂停、取消、超时、重试、检查点和恢复。",
  "Sandbox":"按任务配置、有隔离边界和生命周期的执行环境，限制行动的技术影响范围。",
  "Workspace":"模型窗口之外、Agent 可读写的工作空间（文件、产物、证据），可被重新挂载。",
  "Artifact":"任务中形成、有复用或交付价值的成果对象，需要稳定引用、版本和保留策略。",
  "Checkpoint":"可以安全恢复执行的位置，包含状态、续行信息和环境依赖。不等于外部副作用幂等。",
  "Event Log":"只追加、不改写的事件日志，记录任务事实如何一步步变化。",
  "Session":"用户或调用方与 Agent 的一段连续交互边界。不等于任务。",
  "Task":"围绕一个可验收目标持续存在的执行对象，可跨会话、进程和节点。",
  "Run":"一次有目标、可暂停、可恢复的任务运行。可跨进程和副本，正确性看任务事实，而不是进程是否存活。",
  "Trace":"一次活跃执行中各项操作的因果链路记录。",
  "Span":"Trace 中有明确开始、结束和结果的单个操作。",
  "Trajectory":"整理后的 Agent 行为轨迹：步骤、工具交换、结果和指标，便于阅读和加工样本。",
  "Outcome":"业务结果是否达成的最终判定，只能由业务应用或获授权的 Verifier 给出。",
  "Evidence":"被业务成功标准明确引用、能支撑判定的证据材料。",
  "Verifier":"单次任务的完成门禁：依据证据检查任务是否真正完成。",
  "Evaluation":"用一致条件比较多个样本和多个 Agent 版本的质量判断体系。",
  "HITL":"Human-in-the-Loop，人在回路：在计划、关键行动或结果验收处引入人的审批与判断。",
  "Guardrail":"在输入、上下文、行动、输出等环节做风险检测与拦截的护栏。不应是唯一安全边界。",
  "Prompt Injection":"提示注入：外部内容里夹带指令，试图改变 Agent 的目标或行为。核心防线是区分指令与数据。",
  "AI Gateway":"模型、工具、Agent 流量的统一治理入口：路由、限流、计量、授权、审计。",
  "Agent Release":"可复现的最小发布单元，绑定模型、Harness、Prompt、Skill、工具权限、环境和评估基线的版本。",
  "Context Manifest":"每次模型调用的“输入清单”：记录模型看到了哪些内容、来源、版本、为何被选中、占多少 Token。",
  "Continuation":"续行包：上下文重置或换实例时，从这里重新加载目标、计划、已确认事实、等待项和剩余预算。",
  "幂等":"同一操作执行一次和执行多次效果相同。有副作用的操作重试前要靠幂等键等机制避免重复。",
  "围栏 Fencing":"用执行代次拒绝过期执行者的写入，防止失联又恢复的旧实例覆盖新结果。",
  "租约":"一段时间内的执行权，像接力棒：只有持有最新租约的实例才能提交状态。",
  "Durable Execution":"任务执行不依赖某个进程或机器，靠外部持久状态在新实例上继续。",
  "TTFT":"Time to First Token，首个有效 Token 的等待时间，主要受排队和 Prefill 影响。",
  "TPOT":"Time per Output Token，平均每个输出 Token 的时延，更接近 Decode 阶段的生成速度。",
  "SFT":"监督微调：用经过验证的示范行为训练模型，提高这些行为在相似情境下出现的概率。",
  "Agentic RL":"让模型在环境中实际执行任务，依据可验证的结果反馈优化决策策略。",
  "模型蒸馏":"让小模型学习强模型在目标任务上的输出或行动轨迹，以更低成本承担可界定的工作。",
  "Rubric":"评分细则：写明必须覆盖什么、怎样判分、哪些错误不可接受。",
  "Badcase":"经确认的、Agent 表现不合格的样本。",
  "黄金数据集":"经过业务确认、题目与判断标准都可信的任务集合，用于反复评估、比较和回归。",
  "Pipeline":"把运行数据持续加工成业务可用样本的数据处理任务。",
  "ARD":"Agentic Resource Discovery：按任务意图跨类型发现 Prompt、Skill、MCP Server、Agent 等资源。",
  "RAD":"Remote Agent Discovery：解析远程 Agent 的版本、调用接口、协议和当前可用端点。",
  "AgentCard":"A2A 协议中描述 Agent 名称、能力、接口的卡片。不能仅凭声明建立可信身份。",
  "Agentic OS":"为 Agent 任务提供公共运行对象、能力接入、可强制边界与统一证据的系统层，不持有任务语义。",
  "Budget Lease":"预算租约：有上限、有期限、可收回的资源与调用额度，可随子任务派生并级联撤销。",
  "eBPF":"Linux 内核中的可编程观测技术，可无侵入地采集进程、文件、网络事件。",
  "On-Behalf-Of":"代表用户委托：Agent 以用户身份和权限访问下游资源，且权限不超过用户本身。",
  "DoW":"Denial of Wallet，拒绝钱包攻击：诱导 Agent 长时间消耗 Token 和付费资源。",
  "SSRF":"服务器端请求伪造：诱导服务端访问非预期的网络目标（如内网、云元数据服务）。",
  "本体":"Ontology：显式定义业务对象、关系、动作和规则，让 Agent 理解业务世界的结构。",
  "Copy-on-Write":"写时复制：快照后未修改的数据继续共享，只有修改部分产生新数据块。",
  "背压":"Backpressure：下游处理不过来时让上游减速，避免过载崩溃。",
  "Subagent":"由父 Agent 委派、执行有边界子任务的 Agent，父 Agent 保留总体责任。",
  "Handoff":"移交：任务控制权转移，接收者成为当前责任人。",
  "Delegation":"委派：父任务保留责任，把有边界的子任务交出去，结果回来后由父任务验收。",
  "AG-UI":"表达 Agent 与前端之间双向流式交互事件的协议。",
  "A2UI":"让 Agent 声明式地描述界面（表单、卡片、列表），由客户端用受信组件渲染。",
  "Steering":"运行中修正：用户在任务执行时追加信息、改变优先级、缩小范围。"
};
var GLOSS_ALIAS = {"围栏":"围栏 Fencing","Fencing":"围栏 Fencing","rubric":"Rubric"};

var tip = $("#tip");
function showTip(e, key){
  var k = GLOSS_ALIAS[key] || key;
  var d = GLOSS[k];
  if (!d) return;
  tip.innerHTML = "<b>" + k + "</b><br>" + d;
  tip.style.opacity = 1;
  var x = Math.min(e.clientX + 14, window.innerWidth - 360);
  var y = e.clientY + 18;
  if (y + 120 > window.innerHeight) y = e.clientY - 110;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.style.opacity = 0; }
$$(".t").forEach(function(t){
  var key = t.getAttribute("data-k") || t.textContent.trim();
  t.addEventListener("mouseenter", function(e){ showTip(e, key); });
  t.addEventListener("mousemove", function(e){ showTip(e, key); });
  t.addEventListener("mouseleave", hideTip);
  t.addEventListener("click", function(e){ showTip(e, key); setTimeout(hideTip, 3500); });
});

function renderGloss(q){
  var box = $("#gloss"); box.innerHTML = "";
  q = (q || "").trim().toLowerCase();
  Object.keys(GLOSS).forEach(function(k){
    if (q && k.toLowerCase().indexOf(q) < 0 && GLOSS[k].toLowerCase().indexOf(q) < 0) return;
    box.appendChild(el("div", {"class":"gl"}, "<b>" + k + "</b><span>" + GLOSS[k] + "</span>"));
  });
  if (!box.children.length) box.innerHTML = '<div class="gl"><span>没有找到相关术语。</span></div>';
}
renderGloss("");
$("#gq").addEventListener("input", function(){ renderGloss(this.value); });

(function buildRing(){
  var ns = "http://www.w3.org/2000/svg", g = $("#ring-nodes"), ga = $("#ring-arrows");
  var cx = 200, cy = 200, R = 140, n = STAGES.length;
  var pts = STAGES.map(function(s, i){
    var a = -Math.PI/2 + i * 2*Math.PI/n;
    return {x: cx + R*Math.cos(a), y: cy + R*Math.sin(a)};
  });
  pts.forEach(function(p, i){
    var q = pts[(i+1)%n];
    var dx = q.x - p.x, dy = q.y - p.y, L = Math.sqrt(dx*dx+dy*dy), r = 40;
    var line = document.createElementNS(ns, "line");
    line.setAttribute("x1", p.x + dx/L*r); line.setAttribute("y1", p.y + dy/L*r);
    line.setAttribute("x2", q.x - dx/L*r); line.setAttribute("y2", q.y - dy/L*r);
    line.setAttribute("stroke", "#b8b2a3"); line.setAttribute("stroke-width", "2");
    line.setAttribute("marker-end", "url(#arw)");
    ga.appendChild(line);
  });
  STAGES.forEach(function(s, i){
    var p = pts[i], node = document.createElementNS(ns, "g");
    node.setAttribute("class", "node"); node.setAttribute("data-i", i);
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 36);
    c.setAttribute("fill", "#fff"); c.setAttribute("stroke", s.c); c.setAttribute("stroke-width", 2.5);
    var t1 = document.createElementNS(ns, "text");
    t1.setAttribute("x", p.x); t1.setAttribute("y", p.y + 1); t1.setAttribute("text-anchor", "middle");
    t1.setAttribute("font-size", "14"); t1.setAttribute("font-weight", "700"); t1.setAttribute("fill", s.c);
    t1.textContent = s.name;
    var t2 = document.createElementNS(ns, "text");
    t2.setAttribute("x", p.x); t2.setAttribute("y", p.y + 18); t2.setAttribute("text-anchor", "middle");
    t2.setAttribute("font-size", "10.5"); t2.setAttribute("fill", "#7b818c");
    t2.textContent = s.ch;
    node.appendChild(c); node.appendChild(t1); node.appendChild(t2);
    node.addEventListener("click", function(){ showStage(i); });
    g.appendChild(node);
  });
})();
function showStage(i){
  $$("#ring-nodes .node").forEach(function(n){ n.classList.toggle("on", +n.getAttribute("data-i") === i); });
  var s = STAGES[i];
  $("#map-out").innerHTML =
    '<div class="mini" style="border-left:4px solid '+s.c+'"><h4 style="color:'+s.c+'">'+s.name.slice(2)+'篇 · '+s.ch+'</h4>' +
    '<p><b>核心问题：</b>'+s.q+'</p><p>'+s.d+'</p><p><a href="#'+s.id+'">跳到这一篇 →</a></p></div>' +
    '<p style="font-size:13.5px;color:var(--ink2);margin:10px 0 4px">闭环之外还有两部分：</p>' +
    EXTRA.map(function(e){ return '<div class="mini" style="margin-top:6px"><h4>'+e.name+' · '+e.ch+'</h4><p>'+e.d+' <a href="#'+e.id+'">跳转 →</a></p></div>'; }).join("") +
    '<p style="font-size:13.5px;color:var(--ink2)">注意两条回路：调优产生的变更要<b>回到构建</b>重新过门禁；问题出在形态或权限模型本身时，要<b>回到架构</b>重新设计。</p>';
}

function formResult(){
  if (Object.keys(fa).length < FQ.length) { $("#form-out").innerHTML = "已回答 " + Object.keys(fa).length + " / " + FQ.length + " 题。"; return; }
  var base, why = [];
  if (fa.path === "yes" && fa.risk === "yes") { base = "Workflow（L2 受控自动化）"; why.push("路径可穷举、出错代价高，确定性流程更好测、好审计。"); }
  else if (fa.path === "yes") { base = "Workflow，或在 Workflow 中局部使用 Agent"; why.push("路径能穷举，不需要把整个任务循环交给 Agent。"); }
  else if (fa.risk === "yes") { base = "Hybrid（Workflow + Agent）"; why.push("路径难预知，但高风险环节应由 Workflow 固定审批、交易、发布边界，Agent 负责检索、分析、方案生成。"); }
  else { base = "Single-Agent"; why.push("路径难预知、风险可控，由单个 Agent 持有任务循环是基础形态。"); }
  var ext = [];
  if (fa.span === "yes" && fa.path === "no") ext.push("扩展为 <b>Long-Horizon</b>：补齐持久状态、检查点、任务调度和恢复。");
  if (fa.roles === "yes" && fa.path === "no") ext.push("扩展为 <b>Multi-Agent</b>：明确角色、权限、编排、通信与责任边界，并评估通信开销和失败传播。");
  if (fa.roles === "yes" && fa.path === "yes") why.push("注意：路径可穷举时，多角色问题通常用流程拆分解决，未必需要多 Agent。");
  if (fa.roles === "no" && fa.span === "no") why.push("书中建议：先把边界明确的 Single-Agent 验证扎实，再考虑长程或多 Agent。");
  $("#form-out").innerHTML = "<b>推荐起点：</b>" + base + "<br>" + why.join("<br>") + (ext.length ? "<br>" + ext.join("<br>") : "") +
    '<br><span style="color:var(--ink3);font-size:13px">原则：为每类任务选择成本与风险可接受的“最低充分架构”。更复杂的形态只有在解决了单 Agent 无法以合理成本可靠完成的问题时才合理。</span>';
}

    "<div><b style='color:var(--green)'>" + strict + "</b><span>原子预留：准入时按最大消耗扣减预留，放行 " + k + " 个，其余拒绝</span></div></div>" +
    (naive > bal ? "<p style='font-size:13px;margin:.5em 0 0;color:var(--red)'>超支 " + (naive - bal) + "。响应后的原子扣减能防止丢账，但撤销不了已经发生的消耗。</p>" : "<p style='font-size:13px;margin:.5em 0 0'>这组参数下不会超支。试试调大并发或单次消耗。</p>");
}

  {q:"调优系统自动生成了一个更好的 Skill 补丁，接下来应该？", o:["直接热更新到生产","作为候选，回到构建阶段做评估、审批、灰度后再发布","让 Agent 自己决定是否采用"], a:1, w:"调优不是让 Agent 在生产里自由修改自己（第 2、23 章）。"},
  {q:"按第 30 章，自治程度的上限主要由什么决定？", o:["模型能力","可撤销范围与可证明范围","Agent 数量"], a:1, w:"既不能撤销、也不能证明结果的操作，交给自主执行缺少工程依据（第 30 章）。"}
];
var qs = {};
(function(){
  var box = $("#quiz-box");
  QZ.forEach(function(item, i){
    var row = el("div", {"class":"q-row"}, '<div class="qt"><b>' + (i+1) + ".</b> " + item.q + '</div>');
    var bs = el("div", {"class":"btns"}), fb = el("div", {"class":"fb"});
    item.o.forEach(function(o, j){
      var b = el("button", {"class":"btn"}, o);
      b.addEventListener("click", function(){
        $$(".btn", bs).forEach(function(x){ x.classList.remove("good","bad"); });
        var ok = j === item.a; b.classList.add(ok ? "good" : "bad");
        if (!ok) bs.children[item.a].classList.add("good");
        fb.innerHTML = (ok ? "✓ 正确。" : "✗ 正确答案已标绿。") + " " + item.w; fb.classList.add("show");
        qs[i] = ok; score();
      });
      bs.appendChild(b);
    });
    row.appendChild(bs); row.appendChild(fb); box.appendChild(row);
  });
})();
function score(){
  var n = Object.keys(qs).length, c = Object.keys(qs).filter(function(k){ return qs[k]; }).length;
  var msg = "已答 " + n + " / " + QZ.length + "，答对 " + c + " 题。";
  if (n === QZ.length) msg += c >= 10 ? " 主线已经掌握得很好。" : c >= 7 ? " 大部分理解了，可以回看答错题目对应的章节。" : " 建议先重读“12 条原则”，再看对应章节。";
  $("#quiz-score").textContent = msg;
}

/* ================= 阅读进度 ================= */
var KEY = "agent-handbook-explainer-read";
var read = {};
try { read = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { read = {}; }
function syncRead(){
  var n = 0;
  $$(".markread").forEach(function(b){
    var ch = b.getAttribute("data-ch"), on = !!read[ch];
    if (on) n++;
    b.classList.toggle("done", on);
    b.textContent = on ? "✓ 已读（再点取消）" : "标记本章已读";
    var a = $('.toc a[href="#ch' + ch + '"]'); if (a) a.classList.toggle("read", on);
  });
  $("#pbar").style.width = (n / 30 * 100) + "%";
  $("#ptext").textContent = n + "/30";
}
$$(".markread").forEach(function(b){
  b.addEventListener("click", function(){
    var ch = b.getAttribute("data-ch");
    if (read[ch]) delete read[ch]; else read[ch] = 1;
    try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {}
    syncRead();
  });
});
syncRead();

/* 点击目录里的章节时自动展开 */
function openFromHash(){
  var id = location.hash.slice(1);
  var d = id && document.getElementById(id);
  if (d && d.tagName === "DETAILS") d.open = true;
}
window.addEventListener("hashchange", openFromHash); openFromHash();

/* 目录高亮 */
var secs = $$("section.block, details.ch");
function onScroll(){
  animateBars();
  var cur = null;
  secs.forEach(function(s){ if (s.getBoundingClientRect().top < 140) cur = s.id; });
  $$(".toc a").forEach(function(a){ a.classList.toggle("active", a.getAttribute("href") === "#" + cur); });
}
window.addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();
</script>
